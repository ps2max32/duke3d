# .github/workflows/ps2.yml of an app repo (quake1, quake2, quake3, descent3, ...),
# on its default branch (ps2). Replace APP with the repo name.
# Every push and PR: build with ghcr.io/ps2max32/ps2max, keep the ELF as an
# artifact. A tag v*: also a GitHub release with the ELF.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2max32/ps2max:latest
    steps:
      # git first: the submodules, and ps2/patches.sh applies the PS2's patches to them
      - name: Git
        run: |
          apk add --no-cache git
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Submodules
        run: make submodules
      - name: Build
        run: make -j$(nproc) OUT=$PWD/out
      - uses: actions/upload-artifact@v4
        with:
          name: duke3d-${{ github.sha }}
          path: |
            out/*.elf
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache github-cli
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            $(ls out/*.elf 2>/dev/null)
